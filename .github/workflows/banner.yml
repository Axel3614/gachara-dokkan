# I banner di Dokkan che mancano, scaricati da soli (copia in D:\App\Gachadex\strumenti\banner-dokkan, docs/dokkan.md,
# "I banner degli eventi nuovi"). Ogni ora, mezz'ora dopo l'aggiornatore di DokkanDB (gachadex-releases, minuto 23):
# legge i dati pubblicati e scarica dallo specchio di DokkanDB solo i banner nuovi, una richiesta ogni 4 secondi.
# Quasi sempre non c'è niente da scaricare e il giro dura pochi secondi.
name: Banner

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Senza i file (il repository pesa più di 100 MB): l'albero basta per sapere cosa c'è già.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            .banner-mancanti.json
            banner-nuovi.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: I banner che mancano
        run: node banner-nuovi.mjs
      - name: Sul sito
        run: |
          git add --sparse -A banners images .banner-mancanti.json 2>/dev/null || git add --sparse -A .banner-mancanti.json
          if git diff --cached --quiet; then echo "niente di nuovo"; exit 0; fi
          git -c user.name="Gachara" -c user.email="noreply@github.com" commit -q -m "Banner nuovi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
